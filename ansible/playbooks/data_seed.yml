---
- name: Seed deterministic data into Redis Cluster
  hosts: redis-node-1
  become: no
  gather_facts: no

  vars:
    key_count: "{{ keys | default(1000) }}"

  tasks:
    - name: Seed deterministic key-value pairs
      shell: |
        inserted=0
        failed=0

        for i in $(seq 1 {{ key_count }}); do
          result=$(redis-cli -c -h 10.10.0.11 -p 6379 SET "user:$i" "value-$i")

          if [ "$result" = "OK" ]; then
            inserted=$((inserted + 1))
          else
            echo "FAILED: user:$i returned: $result"
            failed=$((failed + 1))
          fi
        done

        echo ""
        echo "Key distribution across masters:"
        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)

        echo "$cluster_nodes" | awk '$3 ~ /master/ && $3 !~ /fail/ {print $2}' | while read -r address; do
          ip=$(echo "$address" | cut -d: -f1)
          keys_on_master=$(redis-cli -h "$ip" -p 6379 dbsize)
          echo "$ip:6379 -> $keys_on_master keys"
        done

        echo ""

        if [ "$failed" -eq 0 ]; then
          echo "PASS - $inserted/{{ key_count }} keys inserted; failures: 0"
          exit 0
        fi

        echo "FAIL - $inserted/{{ key_count }} keys inserted; failures: $failed"
        exit 1
      register: seed_output
      changed_when: true

    - name: Show seed summary
      debug:
        msg: "{{ seed_output.stdout_lines }}"
