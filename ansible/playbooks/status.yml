---
- name: Show dynamic Redis Cluster status
  hosts: redis-node-1
  become: no
  gather_facts: no

  tasks:
    - name: Print Redis Cluster status dynamically
      shell: |
        echo "===== Redis Cluster Status ====="
        echo ""

        cluster_state=$(redis-cli -h 10.10.0.11 -p 6379 cluster info | grep "^cluster_state:" | cut -d: -f2 | tr -d '\r')
        echo "Cluster State: $cluster_state"
        echo ""

        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)

        echo "MASTERS"
        echo "$cluster_nodes" | awk '$3 ~ /master/ && $3 !~ /fail/ {print $2}' | while read address; do
          ip=$(echo "$address" | cut -d: -f1)
          version=$(redis-cli -h "$ip" -p 6379 info server | grep "^redis_version:" | cut -d: -f2 | tr -d '\r')
          keys=$(redis-cli -h "$ip" -p 6379 dbsize)
          mem=$(redis-cli -h "$ip" -p 6379 info memory | grep "^used_memory_human:" | cut -d: -f2 | tr -d '\r')
          slots=$(echo "$cluster_nodes" | grep "$ip:6379" | awk '{for(i=9;i<=NF;i++) printf $i" "; print ""}')
          echo "$ip:6379 [master] v$version slots: $slots keys: $keys mem: $mem"
        done

        echo ""
        echo "REPLICAS"
        echo "$cluster_nodes" | awk '$3 ~ /slave/ && $3 !~ /fail/ {print $2}' | while read address; do
          ip=$(echo "$address" | cut -d: -f1)
          version=$(redis-cli -h "$ip" -p 6379 info server | grep "^redis_version:" | cut -d: -f2 | tr -d '\r')
          keys=$(redis-cli -h "$ip" -p 6379 dbsize)
          mem=$(redis-cli -h "$ip" -p 6379 info memory | grep "^used_memory_human:" | cut -d: -f2 | tr -d '\r')
          master_host=$(redis-cli -h "$ip" -p 6379 info replication | grep "^master_host:" | cut -d: -f2 | tr -d '\r')
          master_port=$(redis-cli -h "$ip" -p 6379 info replication | grep "^master_port:" | cut -d: -f2 | tr -d '\r')
          echo "$ip:6379 [replica] v$version replicating: $master_host:$master_port keys: $keys mem: $mem"
        done
      register: status_output
      changed_when: false

    - name: Show status output
      debug:
        msg: "{{ status_output.stdout_lines }}"