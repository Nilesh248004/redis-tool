---
- name: Verify deterministic data in Redis Cluster
  hosts: redis-node-1
  become: no
  gather_facts: no

  vars:
    key_count: "{{ keys | default(1000) }}"

  tasks:
    - name: Verify all seeded keys
      shell: |
        verified=0
        missing=0
        mismatched=0

        for i in $(seq 1 {{ key_count }}); do
          value=$(redis-cli -c -h 10.10.0.11 -p 6379 GET "user:$i")

          if [ -z "$value" ]; then
            echo "MISSING: user:$i"
            missing=$((missing + 1))
          elif [ "$value" != "value-$i" ]; then
            echo "FAILED: user:$i expected value-$i but got $value"
            mismatched=$((mismatched + 1))
          else
            verified=$((verified + 1))
          fi
        done

        if [ "$missing" -eq 0 ] && [ "$mismatched" -eq 0 ]; then
          echo "PASS - $verified/{{ key_count }} keys verified"
          exit 0
        fi

        echo "FAIL - $missing keys missing, $mismatched values mismatched"
        exit 1
      register: verify_output
      changed_when: false

    - name: Show verification result
      debug:
        msg: "{{ verify_output.stdout_lines }}"
