---
- name: Prepare new Redis scale-out nodes only if they are not already in cluster
  hosts: redis_new_nodes
  become: yes
  gather_facts: yes

  vars:
    redis_version: "{{ cluster_version.stdout }}"
    redis_tarball: "redis-{{ redis_version }}.tar.gz"
    redis_url: "https://download.redis.io/releases/{{ redis_tarball }}"
    redis_src_dir: "/tmp/redis-{{ redis_version }}"

  tasks:
    - name: Detect the current cluster Redis version
      shell: |
        redis-cli -h 10.10.0.11 -p 6379 info server |
          awk -F: '/^redis_version:/ {gsub("\r", "", $2); print $2}'
      delegate_to: redis-node-1
      become: no
      register: cluster_version
      changed_when: false

    - name: Check if this node is already part of Redis Cluster
      shell: redis-cli -h 10.10.0.11 -p 6379 cluster nodes | grep -q "{{ internal_ip }}:6379"
      delegate_to: redis-node-1
      become: no
      register: node_already_in_cluster
      failed_when: false
      changed_when: false

    - name: Show node cluster membership status
      debug:
        msg: "{{ inventory_hostname }} is already in cluster: {{ node_already_in_cluster.rc == 0 }}"

    - name: Stop any existing Redis process on a new node
      shell: pkill redis-server || true
      changed_when: false
      when: node_already_in_cluster.rc != 0

    - name: Install build dependencies
      apt:
        name:
          - build-essential
          - tcl
          - wget
          - tar
          - make
          - gcc
        state: present
        update_cache: yes
      when: node_already_in_cluster.rc != 0

    - name: Remove old Redis source directory
      file:
        path: "{{ redis_src_dir }}"
        state: absent
      when: node_already_in_cluster.rc != 0

    - name: Download Redis source
      get_url:
        url: "{{ redis_url }}"
        dest: "/tmp/{{ redis_tarball }}"
        mode: "0644"
      when: node_already_in_cluster.rc != 0

    - name: Extract Redis source
      unarchive:
        src: "/tmp/{{ redis_tarball }}"
        dest: /tmp
        remote_src: yes
      when: node_already_in_cluster.rc != 0

    - name: Build Redis from source
      command: make -j2
      args:
        chdir: "{{ redis_src_dir }}"
      when: node_already_in_cluster.rc != 0

    - name: Install Redis binaries
      command: make install
      args:
        chdir: "{{ redis_src_dir }}"
      when: node_already_in_cluster.rc != 0

    - name: Create redis user
      user:
        name: redis
        shell: /usr/sbin/nologin
        system: yes
        create_home: no
      when: node_already_in_cluster.rc != 0

    - name: Create Redis directories
      file:
        path: "{{ item }}"
        state: directory
        owner: redis
        group: redis
        mode: "0755"
      loop:
        - /etc/redis
        - /var/lib/redis
        - /var/log/redis
        - /var/run/redis
      when: node_already_in_cluster.rc != 0

    - name: Clear stale Redis state before first cluster join
      shell: |
        rm -rf /var/lib/redis/*
        rm -f /var/log/redis/redis-server.log
      changed_when: true
      when: node_already_in_cluster.rc != 0

    - name: Create Redis cluster configuration
      copy:
        dest: /etc/redis/redis.conf
        owner: redis
        group: redis
        mode: "0644"
        content: |
          bind 0.0.0.0
          protected-mode no
          port 6379
          daemonize yes
          supervised no
          pidfile /var/run/redis/redis-server.pid
          dir /var/lib/redis
          logfile /var/log/redis/redis-server.log
          appendonly yes

          cluster-enabled yes
          cluster-config-file nodes.conf
          cluster-node-timeout 5000

          cluster-announce-ip {{ internal_ip }}
          cluster-announce-port 6379
          cluster-announce-bus-port 16379
      when: node_already_in_cluster.rc != 0

    - name: Start Redis with cluster config
      command: redis-server /etc/redis/redis.conf
      when: node_already_in_cluster.rc != 0

    - name: Wait for Redis port
      wait_for:
        host: "{{ internal_ip }}"
        port: 6379
        state: started
        timeout: 60

    - name: Check Redis ping
      command: redis-cli -h "{{ internal_ip }}" -p 6379 ping
      register: redis_ping
      changed_when: false

    - name: Show Redis ping result
      debug:
        msg: "{{ inventory_hostname }} ping result: {{ redis_ping.stdout }}"


- name: Add new master and replica to existing Redis Cluster
  hosts: redis-node-1
  become: no
  gather_facts: no

  tasks:
    - name: Check current cluster health before scale out
      shell: redis-cli -h 10.10.0.11 -p 6379 cluster info | grep cluster_state
      register: cluster_state_before
      changed_when: false

    - name: Fail if cluster is not healthy before scale out
      fail:
        msg: "Cluster is not healthy before scale out: {{ cluster_state_before.stdout }}"
      when: "'cluster_state:ok' not in cluster_state_before.stdout"

    - name: Add redis-node-7 as new master if not already added
      shell: |
        if redis-cli -h 10.10.0.11 -p 6379 cluster nodes | grep -q "10.10.0.17:6379"; then
          echo "redis-node-7 already exists in cluster"
        else
          redis-cli --cluster add-node 10.10.0.17:6379 10.10.0.11:6379 --cluster-yes
        fi
      register: add_master_output
      changed_when: "'New node added correctly' in add_master_output.stdout"

    - name: Get redis-node-7 node id
      command: redis-cli -h 10.10.0.17 -p 6379 cluster myid
      register: node7_id
      retries: 20
      delay: 2
      until: node7_id.stdout | length > 0
      changed_when: false

    - name: Wait until the seed recognizes redis-node-7 stable node id
      shell: |
        redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
          awk -v node_id="{{ node7_id.stdout }}" '
            $1 == node_id && $2 ~ /^10.10.0.17:6379@/ { found=1 }
            END { exit(found ? 0 : 1) }
          '
      register: node7_seed_view
      retries: 30
      delay: 2
      until: node7_seed_view.rc == 0
      changed_when: false

    - name: Add redis-node-8 to the cluster if not already added
      shell: |
        if redis-cli -h 10.10.0.11 -p 6379 cluster nodes | grep -q "10.10.0.18:6379"; then
          echo "redis-node-8 already exists in cluster"
        else
          redis-cli --cluster add-node 10.10.0.18:6379 10.10.0.11:6379 --cluster-yes
        fi
      register: add_node8_output
      retries: 20
      delay: 2
      until: add_node8_output.rc == 0
      changed_when: "'New node added correctly' in add_node8_output.stdout"

    - name: Get redis-node-8 node id
      command: redis-cli -h 10.10.0.18 -p 6379 cluster myid
      register: node8_id
      retries: 20
      delay: 2
      until: node8_id.stdout | length > 0
      changed_when: false

    - name: Wait until every master knows both new nodes
      shell: |
        set -eu

        master_ips=$(
          redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
            awk '$3 ~ /master/ && $3 !~ /fail/ {
              split($2, address, "@")
              split(address[1], endpoint, ":")
              print endpoint[1]
            }'
        )

        for master_ip in $master_ips; do
          cluster_nodes=$(redis-cli -h "$master_ip" -p 6379 cluster nodes)
          echo "$cluster_nodes" | grep -q "^{{ node7_id.stdout }} "
          echo "$cluster_nodes" | grep -q "^{{ node8_id.stdout }} "
        done
      register: cluster_convergence
      retries: 30
      delay: 2
      until: cluster_convergence.rc == 0
      changed_when: false

    - name: Normalize unexpected redis-node-7 and redis-node-8 roles
      shell: |
        set -eu

        seed="10.10.0.11:6379"
        node7_ip="10.10.0.17"
        node8_ip="10.10.0.18"
        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)
        node7_line=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.17:6379@/')
        node8_line=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.18:6379@/')
        node7_role=$(echo "$node7_line" | awk '{print $3}')
        node8_role=$(echo "$node8_line" | awk '{print $3}')
        node8_master=$(echo "$node8_line" | awk '{print $4}')

        if echo "$node7_role" | grep -q "master" &&
           echo "$node8_role" | grep -q "slave" &&
           [ "$node8_master" = "{{ node7_id.stdout | trim }}" ]; then
          echo "Scale-out roles are already correct"
          exit 0
        fi

        node8_id=$(echo "$node8_line" | awk '{print $1}')
        node8_slots=$(echo "$node8_line" | awk '{
          for (i=9; i<=NF; i++) {
            if ($i !~ /^\[/) {
              print $i
            }
          }
        }')

        if echo "$node8_role" | grep -q "master" && [ -n "$node8_slots" ]; then
          redis-cli --cluster rebalance "$seed" \
            --cluster-weight "$node8_id=0" \
            --cluster-use-empty-masters \
            --cluster-yes
        fi

        if [ -n "$node8_id" ]; then
          redis-cli --cluster del-node "$seed" "$node8_id"
        fi

        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)
        node7_line=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.17:6379@/')
        node7_id=$(echo "$node7_line" | awk '{print $1}')
        node7_role=$(echo "$node7_line" | awk '{print $3}')
        node7_slots=$(echo "$node7_line" | awk '{
          for (i=9; i<=NF; i++) {
            if ($i !~ /^\[/) {
              print $i
            }
          }
        }')

        if [ -n "$node7_id" ] && ! echo "$node7_role" | grep -q "master"; then
          if [ -n "$node7_slots" ]; then
            echo "Refusing to remove redis-node-7 because it still owns slots: $node7_slots"
            exit 1
          fi

          redis-cli --cluster del-node "$seed" "$node7_id"
        fi

        if ! redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
             grep -q "${node7_ip}:6379"; then
          redis-cli -h "$node7_ip" -p 6379 cluster reset hard
          redis-cli --cluster add-node "${node7_ip}:6379" "$seed" --cluster-yes
        fi

        for attempt in $(seq 1 30); do
          node7_line=$(
            redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
              awk '$2 ~ /^10.10.0.17:6379@/'
          )

          if echo "$node7_line" | awk '$3 ~ /master/ && $3 !~ /fail/ {found=1} END {exit(found ? 0 : 1)}'; then
            break
          fi

          if [ "$attempt" -eq 30 ]; then
            echo "redis-node-7 did not rejoin as a master"
            exit 1
          fi

          sleep 2
        done

        if ! redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
             grep -q "${node8_ip}:6379"; then
          redis-cli -h "$node8_ip" -p 6379 cluster reset hard
          redis-cli --cluster add-node "${node8_ip}:6379" "$seed" --cluster-yes
        fi
      register: normalize_scale_out_roles
      retries: 3
      delay: 2
      until: normalize_scale_out_roles.rc == 0
      changed_when: "'Scale-out roles are already correct' not in normalize_scale_out_roles.stdout"

    - name: Refresh redis-node-7 node id after role normalization
      command: redis-cli -h 10.10.0.17 -p 6379 cluster myid
      register: normalized_node7_id
      retries: 20
      delay: 2
      until: normalized_node7_id.stdout | length > 0
      changed_when: false

    - name: Refresh redis-node-8 node id after role normalization
      command: redis-cli -h 10.10.0.18 -p 6379 cluster myid
      register: normalized_node8_id
      retries: 20
      delay: 2
      until: normalized_node8_id.stdout | length > 0
      changed_when: false

    - name: Drain slots from redis-node-8 before assigning its replica role
      shell: |
        node8_slots=$(
          redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
            awk -v node_id="{{ normalized_node8_id.stdout | trim }}" '
              $1 == node_id {
                for (i=9; i<=NF; i++) {
                  if ($i !~ /^\[/) {
                    print $i
                  }
                }
              }
            '
        )

        if [ -z "$node8_slots" ]; then
          echo "redis-node-8 owns no slots"
        else
          redis-cli --cluster rebalance 10.10.0.11:6379 \
            --cluster-weight "{{ normalized_node8_id.stdout | trim }}=0" \
            --cluster-use-empty-masters \
            --cluster-yes
        fi
      register: drain_node8_slots
      retries: 10
      delay: 2
      until: drain_node8_slots.rc == 0
      changed_when: "'Moving' in drain_node8_slots.stdout"

    - name: Assign redis-node-8 as replica of redis-node-7
      shell: |
        set -eu

        node8_line=$(
          redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
            awk -v node_id="{{ normalized_node8_id.stdout | trim }}" '$1 == node_id'
        )
        node8_role=$(echo "$node8_line" | awk '{print $3}')
        node8_master=$(echo "$node8_line" | awk '{print $4}')

        if echo "$node8_role" | grep -q "slave" &&
           [ "$node8_master" = "{{ normalized_node7_id.stdout | trim }}" ]; then
          echo "redis-node-8 is already the replica of redis-node-7"
          exit 0
        fi

        redis-cli -h 10.10.0.18 -p 6379 cluster replicate "{{ normalized_node7_id.stdout | trim }}"

        redis-cli -h 10.10.0.11 -p 6379 cluster nodes |
          awk -v node_id="{{ normalized_node8_id.stdout | trim }}" \
              -v master_id="{{ normalized_node7_id.stdout | trim }}" '
            $1 == node_id && $3 ~ /slave/ && $4 == master_id { found=1 }
            END { exit(found ? 0 : 1) }
          '
      register: assign_node8_replica
      retries: 30
      delay: 2
      until: assign_node8_replica.rc == 0
      changed_when: "'OK' in assign_node8_replica.stdout"

    - name: Wait for redis-node-8 replication link
      shell: |
        replication_info=$(redis-cli -h 10.10.0.18 -p 6379 info replication)
        role=$(echo "$replication_info" | awk -F: '/^role:/ {gsub("\r", "", $2); print $2}')
        link_status=$(echo "$replication_info" | awk -F: '/^master_link_status:/ {gsub("\r", "", $2); print $2}')

        echo "role:$role"
        echo "master_link_status:$link_status"

        [ "$role" = "slave" ] && [ "$link_status" = "up" ]
      register: node8_replication_ready
      retries: 30
      delay: 2
      until: node8_replication_ready.rc == 0
      changed_when: false

    - name: Repair any slot state left by an interrupted rebalance
      shell: |
        cluster_check=$(redis-cli --cluster check 10.10.0.11:6379 2>&1 || true)

        if echo "$cluster_check" | grep -q "following slots are open"; then
          redis-cli --cluster fix 10.10.0.11:6379 --cluster-yes
        else
          echo "No open slots require repair"
        fi
      register: slot_repair
      changed_when: "'Fixing open slot' in slot_repair.stdout"

    - name: Confirm all slots are stable before rebalancing
      shell: redis-cli --cluster check 10.10.0.11:6379 2>&1
      register: stable_slots
      retries: 10
      delay: 2
      until:
        - stable_slots.rc == 0
        - "'following slots are open' not in stable_slots.stdout"
      changed_when: false

    - name: Rebalance hash slots across all masters
      shell: redis-cli --cluster rebalance 10.10.0.11:6379 --cluster-use-empty-masters --cluster-yes
      register: rebalance_output
      retries: 10
      delay: 2
      until: rebalance_output.rc == 0
      changed_when: "'Moving' in rebalance_output.stdout"

    - name: Show rebalance output
      debug:
        msg: "{{ rebalance_output.stdout_lines }}"

    - name: Wait for final 4-master and 4-replica topology
      shell: |
        cluster_info=$(redis-cli -h 10.10.0.11 -p 6379 cluster info)
        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)
        master_count=$(echo "$cluster_nodes" | awk '$3 ~ /master/ && $3 !~ /fail/ {count++} END {print count+0}')
        replica_count=$(echo "$cluster_nodes" | awk '$3 ~ /slave/ && $3 !~ /fail/ {count++} END {print count+0}')
        node7_id=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.17:6379@/ {print $1}')
        node7_slots=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.17:6379@/ {for (i=9; i<=NF; i++) print $i}')
        node8_master=$(echo "$cluster_nodes" | awk '$2 ~ /^10.10.0.18:6379@/ {print $4}')

        echo "$cluster_info"
        echo "topology_masters:$master_count"
        echo "topology_replicas:$replica_count"
        echo "redis_node_7_slots:$node7_slots"

        if echo "$cluster_info" | grep -q '^cluster_state:ok' &&
           [ "$master_count" -eq 4 ] &&
           [ "$replica_count" -eq 4 ] &&
           [ -n "$node7_slots" ] &&
           [ "$node8_master" = "$node7_id" ]; then
          exit 0
        fi

        exit 1
      register: scaled_topology
      retries: 30
      delay: 2
      until: scaled_topology.rc == 0
      changed_when: false

    - name: Show final cluster nodes after scale out
      command: redis-cli -h 10.10.0.11 -p 6379 cluster nodes
      register: cluster_nodes_after
      changed_when: false

    - name: Print final cluster nodes
      debug:
        msg: "{{ cluster_nodes_after.stdout_lines }}"

    - name: Print scale-out completion summary
      debug:
        msg:
          - "SCALE OUT COMPLETE - cluster has 4 masters and 4 replicas"
          - "redis-node-7 is a master with rebalanced hash slots"
          - "redis-node-8 is the replica of redis-node-7"
