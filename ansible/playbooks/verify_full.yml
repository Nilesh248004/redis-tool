---
- name: Full Redis Cluster verification
  hosts: redis-node-1
  become: no
  gather_facts: no

  tasks:
    - name: Run full Redis Cluster verification dynamically
      shell: |
        PASS_COUNT=0
        FAIL_COUNT=0

        print_pass() {
          echo "[PASS] $1"
          PASS_COUNT=$((PASS_COUNT + 1))
        }

        print_fail() {
          echo "[FAIL] $1"
          FAIL_COUNT=$((FAIL_COUNT + 1))
        }

        echo "===== Full Redis Cluster Verification ====="
        echo ""

        cluster_info=$(redis-cli -h 10.10.0.11 -p 6379 cluster info)
        cluster_nodes=$(redis-cli -h 10.10.0.11 -p 6379 cluster nodes)
        node_ips=$(echo "$cluster_nodes" | awk '{split($2,a,":"); print a[1]}')

        # 1. Cluster state
        cluster_state=$(echo "$cluster_info" | grep "^cluster_state:" | cut -d: -f2 | tr -d '\r')

        if [ "$cluster_state" = "ok" ]; then
          print_pass "Cluster state is ok"
        else
          print_fail "Cluster state is not ok"
        fi

        # 2. Hash slot coverage
        slots_assigned=$(echo "$cluster_info" | grep "^cluster_slots_assigned:" | cut -d: -f2 | tr -d '\r')
        slots_ok=$(echo "$cluster_info" | grep "^cluster_slots_ok:" | cut -d: -f2 | tr -d '\r')

        if [ "$slots_assigned" = "16384" ] && [ "$slots_ok" = "16384" ]; then
          print_pass "All 16384 hash slots are covered"
        else
          print_fail "Hash slots are not fully covered"
        fi

        # 3. Node membership and reachability
        known_nodes=$(echo "$cluster_info" | grep "^cluster_known_nodes:" | cut -d: -f2 | tr -d '\r')
        discovered_nodes=$(echo "$node_ips" | grep -vc '^$')
        failed_nodes=$(echo "$cluster_nodes" | awk '$3 ~ /fail/ {count++} END {print count+0}')
        reachable_nodes=0

        for ip in $node_ips; do
          if [ "$(redis-cli -h "$ip" -p 6379 ping 2>/dev/null)" = "PONG" ]; then
            reachable_nodes=$((reachable_nodes + 1))
          fi
        done

        if [ "$known_nodes" -gt 0 ] &&
           [ "$discovered_nodes" -eq "$known_nodes" ] &&
           [ "$reachable_nodes" -eq "$known_nodes" ] &&
           [ "$failed_nodes" -eq 0 ]; then
          print_pass "All $known_nodes cluster nodes are present and reachable"
        else
          print_fail "Node health mismatch: known=$known_nodes discovered=$discovered_nodes reachable=$reachable_nodes failed=$failed_nodes"
        fi

        # 4. Version consistency across all cluster nodes
        versions=""
        version_count=0

        for ip in $node_ips; do
          version=$(redis-cli -h "$ip" -p 6379 info server | grep "^redis_version:" | cut -d: -f2 | tr -d '\r')

          if [ -n "$version" ]; then
            versions="$versions $version"
            version_count=$((version_count + 1))
          fi
        done

        unique_versions=$(echo "$versions" | tr ' ' '\n' | grep -v '^$' | sort -u | wc -l | tr -d ' ')

        if [ "$version_count" -eq "$known_nodes" ] && [ "$unique_versions" = "1" ]; then
          final_version=$(echo "$versions" | awk '{print $1}')
          print_pass "All $known_nodes nodes are running the same Redis version: $final_version"
        else
          print_fail "Redis version mismatch or missing response: $versions"
        fi

        # 5. Every master should have at least one replica
        failed_master_replica_check=0
        master_ids=$(echo "$cluster_nodes" | awk '$3 ~ /master/ && $3 !~ /fail/ {print $1}')
        master_count=$(echo "$master_ids" | grep -vc '^$')
        replica_count=$(echo "$cluster_nodes" | awk '$3 ~ /slave/ && $3 !~ /fail/ {count++} END {print count+0}')

        for master_id in $master_ids; do
          replicas_for_master=$(echo "$cluster_nodes" | awk -v mid="$master_id" '$3 ~ /slave/ && $3 !~ /fail/ && $4 == mid {count++} END {print count+0}')

          if [ "$replicas_for_master" -lt 1 ]; then
            failed_master_replica_check=1
          fi
        done

        if [ "$master_count" -gt 0 ] &&
           [ "$replica_count" -gt 0 ] &&
           [ "$failed_master_replica_check" = "0" ]; then
          print_pass "Topology has $master_count masters and $replica_count replicas; every master has a replica"
        else
          print_fail "Invalid topology or one or more masters do not have replicas"
        fi

        # 6. Replica link status across all replicas
        failed_replication_check=0
        checked_replicas=0

        for ip in $node_ips; do
          replication_info=$(redis-cli -h "$ip" -p 6379 info replication)
          role=$(echo "$replication_info" | grep "^role:" | cut -d: -f2 | tr -d '\r')

          if [ "$role" = "slave" ]; then
            checked_replicas=$((checked_replicas + 1))
            link_status=$(echo "$replication_info" | grep "^master_link_status:" | cut -d: -f2 | tr -d '\r')

            if [ "$link_status" != "up" ]; then
              failed_replication_check=1
            fi
          fi
        done

        if [ "$checked_replicas" -eq "$replica_count" ] &&
           [ "$checked_replicas" -gt 0 ] &&
           [ "$failed_replication_check" = "0" ]; then
          print_pass "All $checked_replicas replicas have master_link_status:up"
        else
          print_fail "Replica count mismatch or one or more replication links are down"
        fi

        # 7. Data integrity
        verified_keys=0
        missing_keys=0
        mismatched_keys=0

        for i in $(seq 1 1000); do
          value=$(redis-cli -c -h 10.10.0.11 -p 6379 GET "user:$i")

          if [ -z "$value" ]; then
            missing_keys=$((missing_keys + 1))
          elif [ "$value" != "value-$i" ]; then
            mismatched_keys=$((mismatched_keys + 1))
          else
            verified_keys=$((verified_keys + 1))
          fi
        done

        if [ "$missing_keys" -eq 0 ] && [ "$mismatched_keys" -eq 0 ]; then
          print_pass "Data integrity verified: $verified_keys/1000 keys matched"
        else
          print_fail "Data integrity failed: $missing_keys keys missing, $mismatched_keys values mismatched"
        fi

        echo ""
        echo "===== Verification Summary ====="
        echo "Passed checks: $PASS_COUNT"
        echo "Failed checks: $FAIL_COUNT"

        if [ "$FAIL_COUNT" = "0" ]; then
          echo "FULL VERIFICATION RESULT: PASS"
          exit 0
        else
          echo "FULL VERIFICATION RESULT: FAIL"
          exit 1
        fi
      register: full_verify_output
      changed_when: false

    - name: Show full verification result
      debug:
        msg: "{{ full_verify_output.stdout_lines }}"
