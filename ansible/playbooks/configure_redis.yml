---
- name: Configure Redis nodes for cluster mode
  hosts: redis_nodes
  become: yes
  gather_facts: yes

  tasks:
    - name: Stop any running Redis process
      shell: "pkill redis-server || true"
      changed_when: false

    - name: Ensure Redis directories exist
      file:
        path: "{{ item }}"
        state: directory
        owner: redis
        group: redis
        mode: "0755"
      loop:
        - /etc/redis
        - /var/lib/redis
        - /var/log/redis
        - /var/run/redis

    - name: Write Redis cluster configuration
      copy:
        dest: /etc/redis/redis.conf
        owner: redis
        group: redis
        mode: "0644"
        content: |
          bind 0.0.0.0
          protected-mode no
          port 6379

          daemonize yes
          supervised no
          pidfile /var/run/redis/redis-server.pid

          loglevel notice
          logfile /var/log/redis/redis-server.log
          dir /var/lib/redis

          dbfilename dump.rdb
          appendonly yes
          appendfilename "appendonly.aof"

          cluster-enabled yes
          cluster-config-file nodes.conf
          cluster-node-timeout 5000

          tcp-backlog 511
          timeout 0
          tcp-keepalive 300

    - name: Start Redis with cluster config
      shell: "redis-server /etc/redis/redis.conf"
      changed_when: true

    - name: Wait for Redis port 6379
      wait_for:
        host: "{{ internal_ip }}"
        port: 6379
        timeout: 20

    - name: Check Redis ping
      command: redis-cli -h "{{ internal_ip }}" -p 6379 ping
      register: redis_ping
      changed_when: false

    - name: Show Redis ping result
      debug:
        msg: "{{ inventory_hostname }} -> {{ redis_ping.stdout }}"