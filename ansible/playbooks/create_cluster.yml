---
- name: Create Redis Cluster
  hosts: redis-node-1
  become: yes
  gather_facts: no

  tasks:
    - name: Wait for Redis to respond on node 1
      command: redis-cli -h 10.10.0.11 -p 6379 ping
      register: ping_result
      retries: 10
      delay: 2
      until: ping_result.stdout == "PONG"
      changed_when: false

    - name: Check current cluster info
      shell: redis-cli -h 10.10.0.11 -p 6379 cluster info || true
      register: cluster_info
      changed_when: false

    - name: Check current cluster nodes
      shell: redis-cli -h 10.10.0.11 -p 6379 cluster nodes || true
      register: cluster_nodes
      changed_when: false

    - name: Wait if cluster already exists but is still stabilizing
      shell: redis-cli -h 10.10.0.11 -p 6379 cluster info | grep cluster_state:ok
      register: existing_cluster_ok
      retries: 10
      delay: 2
      until: existing_cluster_ok.rc == 0
      ignore_errors: yes
      changed_when: false
      when: "'cluster_known_nodes:6' in cluster_info.stdout or cluster_nodes.stdout_lines | length > 1"

    - name: Create Redis cluster with 3 masters and 3 replicas
      shell: |
        yes yes | redis-cli --cluster create \
          10.10.0.11:6379 \
          10.10.0.12:6379 \
          10.10.0.13:6379 \
          10.10.0.14:6379 \
          10.10.0.15:6379 \
          10.10.0.16:6379 \
          --cluster-replicas 1
      register: cluster_create_output
      when: "'cluster_known_nodes:6' not in cluster_info.stdout and (cluster_nodes.stdout_lines | length) <= 1"

    - name: Show cluster creation output
      debug:
        var: cluster_create_output.stdout_lines
      when: cluster_create_output is defined and cluster_create_output.stdout_lines is defined

    - name: Show message if cluster already exists
      debug:
        msg: "Redis cluster already exists. Skipping cluster creation."
      when: "'cluster_known_nodes:6' in cluster_info.stdout or cluster_nodes.stdout_lines | length > 1"

    - name: Verify final cluster state
      command: redis-cli -h 10.10.0.11 -p 6379 cluster info
      register: final_cluster_info
      changed_when: false

    - name: Fail if cluster state is not ok
      fail:
        msg: "Redis cluster is not healthy: {{ final_cluster_info.stdout }}"
      when: "'cluster_state:ok' not in final_cluster_info.stdout"

    - name: Print final cluster info
      debug:
        msg: "{{ final_cluster_info.stdout_lines }}"

    - name: Print final cluster nodes
      command: redis-cli -h 10.10.0.11 -p 6379 cluster nodes
      register: final_cluster_nodes
      changed_when: false

    - name: Show final cluster topology
      debug:
        msg: "{{ final_cluster_nodes.stdout_lines }}"